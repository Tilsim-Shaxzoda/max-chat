<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>LOGIN FORM ||</title>
    <link rel="stylesheet" href="./style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <!-- face-api.js yuklash -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
    <!-- ===================== FACE ID MODAL ===================== -->
    <div id="faceModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
         background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; flex-direction:column;">
        <div style="background:rgba(20,20,40,0.97); border:1px solid rgba(255,255,255,0.15);
             border-radius:16px; padding:25px 20px; width:90%; max-width:360px; text-align:center;
             backdrop-filter:blur(15px); box-shadow:0 8px 32px rgba(0,0,0,0.5);">
            <h3 style="color:#fff; margin:0 0 5px; font-size:18px;">🔒 Yuzni identifikatsiya qiling</h3>
            <p id="faceStatus" style="font-size:13px; color:#fff; margin:8px 0 14px; min-height:36px;"></p>
            <!-- Dumaloq video oyna -->
            <div style="display:flex; justify-content:center; margin-bottom:16px;">
                <div style="width:200px; height:200px; border-radius:50%; overflow:hidden;
                     border:3px solid rgba(255,255,255,0.3); background:#000; position:relative;">
                    <video id="faceVideo" autoplay muted playsinline
                           style="width:100%; height:100%; object-fit:cover; transform:scaleX(-1);"></video>
                </div>
            </div>
            <button id="faceRegisterBtn" style="display:none; width:100%; padding:12px; margin-bottom:8px;
                border:none; border-radius:10px; background:#2ecc71; color:#fff; font-size:15px;
                font-weight:bold; cursor:pointer;">📸 Yuzni saqlash</button>
            <button id="faceVerifyBtn" style="display:none; width:100%; padding:12px; margin-bottom:8px;
                border:none; border-radius:10px; background:#3498db; color:#fff; font-size:15px;
                font-weight:bold; cursor:pointer;">✅ Tasdiqlash</button>
            <button id="faceCancelBtn" style="display:none; width:100%; padding:10px;
                border:none; border-radius:10px; background:rgba(255,255,255,0.12); color:#fff;
                font-size:13px; cursor:pointer;">Bekor qilish</button>
        </div>
    </div>
    <!-- =========================================================== -->

    <div class="wrapper">
        <form id="loginForm">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" id="username" placeholder="Username" required />
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required />
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox" />Remember me </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <script>
        localStorage.removeItem('chatUser');

        // ============================================================
        //  FACE ID — O'ZGARUVCHILAR
        // ============================================================
        let faceStream = null;
        let faceModelsLoaded = false;
        let pendingUsername = null;      // login muvaffaqiyatli bo'lgandan keyin saqlanadi
        let faceCheckInterval = null;    // real-time yuz aniqlash
        const FACE_STORAGE_KEY = 'faceDescriptor_v1'; // localStorage kaliti

        // ============================================================
        //  MODELLARNI YUKLASH (faqat bir marta)
        // ============================================================
        async function loadFaceModels() {
            if (faceModelsLoaded) return;
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                faceModelsLoaded = true;
            } catch(e) {
                console.error('Modellar yuklanmadi:', e);
            }
        }

        // ============================================================
        //  KAMERANI OCHISH / YOPISH
        // ============================================================
        async function startFaceCamera() {
            try {
                faceStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 } });
                const vid = document.getElementById('faceVideo');
                vid.srcObject = faceStream;
                await vid.play();
                // Modellarni kamera bilan parallel yuklaymiz
                loadFaceModels().catch(() => {});
            } catch(e) {
                showFaceStatus('❌ Kamera ruxsat berilmadi!', 'red');
            }
        }
        function stopFaceCamera() {
            if (faceCheckInterval) { clearInterval(faceCheckInterval); faceCheckInterval = null; }
            if (faceStream) { faceStream.getTracks().forEach(t => t.stop()); faceStream = null; }
        }

        // ============================================================
        //  YUZNI OLISH (descriptor)
        // ============================================================
        async function waitForVideoReady(vid) {
            // Video tayyor bo'lguncha kutish (readyState >= 2 = HAVE_CURRENT_DATA)
            if (vid.readyState >= 2) return;
            return new Promise((resolve) => {
                const onReady = () => { vid.removeEventListener('loadeddata', onReady); resolve(); };
                vid.addEventListener('loadeddata', onReady);
                // Maksimum 5 soniya kutish
                setTimeout(resolve, 5000);
            });
        }

        async function captureFaceDescriptor() {
            const vid = document.getElementById('faceVideo');
            // Video oqimi tayyor bo'lguncha kutish
            await waitForVideoReady(vid);
            // Bir necha kadr o'tishini kutish (kamera to'liq ishga tushishi uchun)
            await new Promise(r => setTimeout(r, 300));
            const detection = await faceapi
                .detectSingleFace(vid, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
                .withFaceLandmarks()
                .withFaceDescriptor();
            return detection ? detection.descriptor : null;
        }

        // ============================================================
        //  STATUS MATNI
        // ============================================================
        function showFaceStatus(text, color) {
            const el = document.getElementById('faceStatus');
            el.textContent = text;
            el.style.color = color || '#fff';
        }

        // ============================================================
        //  MODALLARNI OCHISH / YOPISH
        // ============================================================
        function openFaceModal(mode) {
            // mode: 'register' | 'verify'
            document.getElementById('faceModal').style.display = 'flex';
            document.getElementById('faceRegisterBtn').style.display = mode === 'register' ? 'inline-block' : 'none';
            document.getElementById('faceVerifyBtn').style.display = mode === 'verify' ? 'inline-block' : 'none';
            document.getElementById('faceCancelBtn').style.display = mode === 'register' ? 'none' : 'inline-block';
            if (mode === 'register') {
                showFaceStatus('📸 Yuzingizni kameraga qarating va "Yuzni saqlash" tugmasini bosing', '#fff');
            } else {
                showFaceStatus('👁️ Yuzingizni kameraga qarating va "Tasdiqlash" tugmasini bosing', '#fff');
            }
            startFaceCamera();
        }
        function closeFaceModal() {
            stopFaceCamera();
            document.getElementById('faceModal').style.display = 'none';
        }

        // ============================================================
        //  BIRINCHI KIRISH — YUZNI RO'YXATDAN O'TKAZISH
        // ============================================================
        document.getElementById('faceRegisterBtn').addEventListener('click', async () => {
            showFaceStatus('⏳ Modellar yuklanmoqda...', '#f1c40f');
            await loadFaceModels();
            showFaceStatus('📸 Yuzingizni aniqlanmoqda...', '#f1c40f');
            const desc = await captureFaceDescriptor();
            if (!desc) {
                showFaceStatus('❌ Yuz aniqlanmadi! Kameraga to\'g\'ridan qarang.', 'red');
                return;
            }
            // Descriptor ni localStorage ga saqlash
            const arr = Array.from(desc);
            localStorage.setItem(FACE_STORAGE_KEY + '_' + pendingUsername, JSON.stringify(arr));
            showFaceStatus('✅ Yuz muvaffaqiyatli saqlandi!', '#2ecc71');
            setTimeout(() => {
                closeFaceModal();
                localStorage.setItem('chatUser', pendingUsername);
                window.location.href = '/chat.html';
            }, 1200);
        });

        // ============================================================
        //  TASDIQLASH — SAQLANGAN YUZ BILAN SOLISHTIRISH
        // ============================================================
        document.getElementById('faceVerifyBtn').addEventListener('click', async () => {
            showFaceStatus('⏳ Modellar yuklanmoqda...', '#f1c40f');
            await loadFaceModels();
            showFaceStatus('👁️ Yuzingiz tekshirilmoqda...', '#f1c40f');
            const desc = await captureFaceDescriptor();
            if (!desc) {
                showFaceStatus('❌ Yuz aniqlanmadi! Kameraga qarang.', 'red');
                return;
            }
            const saved = localStorage.getItem(FACE_STORAGE_KEY + '_' + pendingUsername);
            if (!saved) {
                showFaceStatus('⚠️ Saqlangan yuz topilmadi, qayta kiriting.', 'orange');
                return;
            }
            const savedDesc = new Float32Array(JSON.parse(saved));
            const distance = faceapi.euclideanDistance(desc, savedDesc);
            // 0.5 dan kichik bo'lsa — bir xil odam (qat'iyroq: 0.45)
            if (distance < 0.50) {
                showFaceStatus('✅ Tasdiqlandi! Kirish...', '#2ecc71');
                setTimeout(() => {
                    closeFaceModal();
                    localStorage.setItem('chatUser', pendingUsername);
                    window.location.href = '/chat.html';
                }, 900);
            } else {
                showFaceStatus('❌ Yuz mos kelmadi! (' + distance.toFixed(2) + ')', 'red');
            }
        });

        // ============================================================
        //  BEKOR QILISH TUGMASI
        // ============================================================
        document.getElementById('faceCancelBtn').addEventListener('click', () => {
            closeFaceModal();
            pendingUsername = null;
        });

        // ============================================================
        //  LOGIN FORMA
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await response.json();
                if (data.success) {
                    pendingUsername = data.username;
                    // Saqlangan yuz bor mi?
                    const hasFace = !!localStorage.getItem(FACE_STORAGE_KEY + '_' + pendingUsername);
                    if (hasFace) {
                        // Tasdiqlash rejimi
                        openFaceModal('verify');
                    } else {
                        // Birinchi marta — ro'yxatdan o'tkazish
                        openFaceModal('register');
                    }
                } else {
                    alert('Login yoki parol xato!');
                }
            } catch (err) { alert('Server bilan aloqa yo\'q!'); }
        });
    </script>
</body>
</html>
